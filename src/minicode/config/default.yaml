# minicode built-in defaults.
#
# Do not edit this file - override it in ~/.minicode/config.yaml (global) or
# ./.minicode/config.yaml (project), with MINICODE_* environment variables, or
# with `--set key=value` on the command line.

default_provider: ""
default_model: ""

# One entry per provider. `type` selects the wire protocol:
#   openai_compat | anthropic_compat | litellm | <dotted.path.to.Class>
providers: {}

agent:
  step_limit: 200
  cost_limit: 10.0
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 4
  # Interrupt after this many identical consecutive tool calls (0 disables)
  doom_loop_threshold: 3

# allow | deny | ask ; patterns are paths (file tools) or commands (bash).
# The bash allow-list below is generated from minicode.project.ECOSYSTEMS so it
# stays language-agnostic. Note '*' stops at '/', so 'rm -rf' needs both forms
# to actually block `rm -rf /x`.
permission:
  read: allow
  glob: allow
  grep: allow
  write: ask
  edit: ask
  apply_patch: ask
  delete: ask
  bash:
    "git status*": allow
    "git diff*": allow
    "git log*": allow
    "git show*": allow
    "git branch*": allow
    "ls*": allow
    "cat*": allow
    "python -m pytest*": allow
    "pytest*": allow
    "python -m ruff check .*": allow
    "ruff check .*": allow
    "python -m mypy .*": allow
    "npm test*": allow
    "pnpm test*": allow
    "yarn test*": allow
    "bun test*": allow
    "npx vitest run*": allow
    "npx jest*": allow
    "npm run lint*": allow
    "npx eslint .*": allow
    "npx tsc --noEmit*": allow
    "go test ./...*": allow
    "go vet ./...*": allow
    "gofmt -l .*": allow
    "cargo test*": allow
    "cargo clippy*": allow
    "cargo fmt --check*": allow
    "mvn test*": allow
    "gradle test*": allow
    "./gradlew test*": allow
    "mvn -q verify*": allow
    "./gradlew check*": allow
    "bundle exec rspec*": allow
    "rake test*": allow
    "bundle exec rubocop*": allow
    "vendor/bin/phpunit*": allow
    "composer test*": allow
    "composer lint*": allow
    "dotnet test*": allow
    "dotnet build*": allow
    "mix test*": allow
    "mix format --check-formatted*": allow
    "flutter test*": allow
    "dart test*": allow
    "flutter analyze*": allow
    "dart analyze*": allow
    "zig build test*": allow
    "zig fmt --check .*": allow
    "swift test*": allow
    "swift build*": allow
    "ctest*": allow
    "make test*": allow
    "meson test*": allow
    "make lint*": allow
    "rm -rf *": deny
    "rm -rf **": deny
    "rm -fr *": deny
    "mkfs*": deny
    ":(){ :|:& };:*": deny
    "shutdown*": deny
    "reboot*": deny
    "*": ask

context:
  max_tokens: 120000
  auto_compact: true
  compact_threshold: 0.85
  prune: true
  prune_protect_tokens: 40000
  prune_minimum_tokens: 20000
  preserve_recent_tokens: 20000
  # Hard cap on preserved turns; null = use the token budget instead
  tail_turns: null
  tool_output_max_lines: 2000
  tool_output_max_bytes: 51200

tools:
  # Empty = enable all builtin tools
  enabled: []
  bash_timeout: 120
  # Modules exposing register_tools(registry) for extra tools
  extra_modules: []

ui:
  stream: true
  max_output_lines: 40
  show_tool_arguments: true
  theme: auto

# Extra environment variables for bash tool runs
env: {}
