[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode"
dynamic = ["version"]
description = "A lightweight, pure-Python OpenCode-like coding agent core built on top of mini-swe-agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "coding-agent", "cli", "llm", "mini-swe-agent"]
authors = [{ name = "minicode contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

# The base (mini-swe-agent) is a hard dependency: the agent loop, model protocol,
# environment abstraction and config utilities are *extended*, not copied.
# openai / anthropic are the two first-class provider SDKs (both speak the
# "*-compatible" wire protocols, so they cover DeepSeek, Qwen, vLLM, OpenRouter, ...).
# textual powers the default full-screen TUI. It is imported lazily (see
# minicode.ui.textual) so that non-interactive entry points - `minicode run`,
# piped stdin, library use - keep working if it is missing.
dependencies = [
    "mini-swe-agent>=2.4.0",
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "textual>=0.80",
    "prompt_toolkit>=3.0",
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # anyio runs the async tests that drive the Textual front-end (App.run_test).
    "anyio>=4.0",
]

[project.scripts]
minicode = "minicode.cli.main:app_entry"

[tool.setuptools.dynamic]
version = { attr = "minicode.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minicode = ["py.typed", "config/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
# fixtures/ holds deliberately broken projects for the E2E task - their tests
# are *supposed* to fail and must never be collected by the suite run.
norecursedirs = ["*.git", "*.venv", "fixtures", "upstream", "build", "dist"]
markers = [
    "unit: fast unit tests with no network",
    "integration: multi-component tests (local OpenAI-compatible server allowed)",
    "e2e: end-to-end coding task",
    "slow: long running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]
